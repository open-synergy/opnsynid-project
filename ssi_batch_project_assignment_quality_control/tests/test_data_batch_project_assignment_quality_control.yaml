scenarios:
  - name: "Batch Project Assignment Quality Control - Create batch and verify"
    steps:
      - step: "Create project role"
        action: "create"
        model: "project.role"
        save_as: "role"
        values:
          name: "Batch QC Role"
          code: "BQCROLE"

      - step: "Create project"
        action: "create"
        model: "project.project"
        save_as: "project"
        values:
          name: "Batch QC Project"

      - step: "Create batch assignment"
        action: "create"
        model: "project.batch_assignment"
        save_as: "batch"
        as_user: "base.user_admin"
        values:
          project_id: "EVAL: registry['project'].id"
          date_assign: "2024-01-15"
          date_start: "2024-01-15"
          date_end: "2024-12-31"

      - step: "Create batch assignee"
        action: "create"
        model: "project.batch_assignment_assignee"
        save_as: "assignee"
        values:
          batch_id: "EVAL: registry['batch'].id"
          role_id: "EVAL: registry['role'].id"
          assignee_id: "REF: base.user_admin"
          sequence: 10

      - step: "Assert batch created"
        action: "assert"
        target: "batch"
        asserts:
          state:
            type: "value"
            expected: "draft"
