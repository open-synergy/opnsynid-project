            expected: 0.0

  - name: "Project - Number of phase for stat button"
    options:
      auto_refresh: true
    steps:
      - step: "Create project"
        action: "create"
        model: "project.project"
        save_as: "project"
        values:
          name: "Test Num Phase Project"

      - step: "Create phase phase"
        action: "create"
        model: "project_phase"
        save_as: "phase"
        as_user: "base.user_admin"
        values:
          name: "Counted Phase"
          title: "Counted Phase"
          ttype: "single"
          project_id: "REC: project.id"

      - step: "Confirm phase"
        action: "call"
        target: "phase"
        method: "action_confirm"
        as_user: "base.user_admin"
        context:
          bypass_policy_check: true
        asserts:
          state:
            type: "value"
            expected: "confirm"

      - step: "Approve phase"
        action: "call"
        target: "phase"
        method: "action_approve_approval"
        as_user: "base.user_admin"
        context:
          bypass_policy_check: true
        asserts:
          state:
            type: "value"
            expected: "open"

      - step: "Recompute number of phase"
        action: "call"
        target: "project"
        method: "_compute_num_of_phase"

      - step: "Assert one phase counted"
        action: "assert"
        target: "project"
        asserts:
          num_of_phase:
            type: "value"
            expected: 1
