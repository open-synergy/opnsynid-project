        target: "parent_phase"
        asserts:
          number_of_child:
            type: "value"
            expected: 1
          number_of_deliverable:
            type: "value"
            expected: 0

  - name: "Project Phase - Single phase without deliverable"
    options:
      auto_refresh: true
    steps:
      - step: "Create project"
        action: "create"
        model: "project.project"
        save_as: "project"
