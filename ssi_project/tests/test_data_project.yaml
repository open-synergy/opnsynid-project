        as_user: "base.user_admin"
        values:
          name: "Empty Phase"
          title: "Empty Phase"
          ttype: "single"
          project_id: "REC: project.id"

      - step: "Assert zero deliverables without error"
        action: "assert"
        target: "phase"
        asserts:
          number_of_deliverable:
            type: "value"
            expected: 0
          number_of_deliverable_done:
            type: "value"
