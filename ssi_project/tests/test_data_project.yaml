      - step: "Approve deliverable_1"
        action: "call"
        target: "deliverable_1"
        method: "action_approve_approval"
        as_user: "base.user_admin"
        context:
          bypass_policy_check: true
        asserts:
          state:
            type: "value"
            expected: "open"

      - step: "Create deliverable_2"
        action: "create"
        model: "project_deliverable"
        save_as: "deliverable_2"
        as_user: "base.user_admin"
        values:
          name: "deliverable_2"
          title: "deliverable_2"
          ttype: "single"
          project_id: "REC: project.id"
          date_due: "2024-12-31"
          phase_id: "REC: phase.id"
          category_id: "REC: category.id"
          type_id: "REC: deliverable_type.id"

      - step: "Confirm deliverable_2"
        action: "call"
        target: "deliverable_2"
        method: "action_confirm"
        as_user: "base.user_admin"
        context:
          bypass_policy_check: true
        asserts:
          state:
            type: "value"
            expected: "confirm"

      - step: "Approve deliverable_2"
        action: "call"
        target: "deliverable_2"
        method: "action_approve_approval"
        as_user: "base.user_admin"
        context:
          bypass_policy_check: true
        asserts:
          state:
            type: "value"
            expected: "open"

      - step: "Mark deliverable_2 as done"
        action: "call"
        target: "deliverable_2"
        method: "action_done"
        as_user: "base.user_admin"
        context:
          bypass_policy_check: true
        asserts:
          state:
            type: "value"
            expected: "done"

      - step: "Assert deliverable counts and percentage"
        action: "assert"
        target: "phase"
        asserts:
          number_of_deliverable:
            type: "value"
            expected: 2
          number_of_deliverable_done:
            type: "value"
            expected: 1
          deliverable_completion_percentage:
            type: "value"
            expected: 0.5
          number_of_child:
            type: "value"
            expected: 0

  - name: "Project Phase - Child phase count of a group phase"
    options:
      auto_refresh: true
    steps:
      - step: "Create project"
        action: "create"
        model: "project.project"
        save_as: "project"
        values:
          name: "Test Child Phase Project"

      - step: "Create phase parent_phase"
        action: "create"
        model: "project_phase"
        save_as: "parent_phase"
        as_user: "base.user_admin"
        values:
          name: "Parent Phase"
          title: "Parent Phase"
          ttype: "group"
          project_id: "REC: project.id"
          date_due: "2024-12-31"

      - step: "Create phase child_phase"
        action: "create"
        model: "project_phase"
        save_as: "child_phase"
        as_user: "base.user_admin"
        values:
          name: "Child Phase"
          title: "Child Phase"
          ttype: "single"
          project_id: "REC: project.id"
          date_due: "2024-12-31"
          parent_id: "REC: parent_phase.id"

      - step: "Confirm child_phase"
        action: "call"
        target: "child_phase"
        method: "action_confirm"
        as_user: "base.user_admin"
        context:
          bypass_policy_check: true
        asserts:
