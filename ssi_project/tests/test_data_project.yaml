scenarios:
  - name: "Project Milestone - Full workflow draft to done"
    steps:
      - step: "Create project"
        action: "create"
        model: "project.project"
        save_as: "project"
        values:
          name: "Test Milestone Project"

      - step: "Create project milestone"
        action: "create"
        model: "project_milestone"
        save_as: "milestone"
        as_user: "base.user_admin"
        values:
          name: "Test Milestone"
          project_id: "EVAL: registry['project'].id"
          date: "2024-12-31"

      - step: "Assert milestone in draft"
        action: "assert"
        target: "milestone"
        asserts:
          state:
            type: "value"
            expected: "draft"

      - step: "Confirm milestone"
        action: "call"
        target: "milestone"
        method: "action_confirm"
        as_user: "base.user_admin"
        context:
          bypass_policy_check: true
        asserts:
          state:
            type: "value"
            expected: "confirm"

      - step: "Invalidate cache after confirm"
        action: "call"
        target: "milestone"
        method: "invalidate_cache"

      - step: "Approve milestone"
        action: "call"
        target: "milestone"
        method: "action_approve_approval"
        as_user: "base.user_admin"
        context:
          bypass_policy_check: true
        asserts:
          state:
            type: "value"
            expected: "open"

      - step: "Invalidate cache after open"
        action: "call"
        target: "milestone"
        method: "invalidate_cache"

      - step: "Mark milestone as done"
        action: "call"
        target: "milestone"
        method: "action_done"
        as_user: "base.user_admin"
        context:
          bypass_policy_check: true
        asserts:
          state:
            type: "value"
            expected: "done"

  - name: "Project Deliverable Type - Create master data"
    steps:
      - step: "Create deliverable type category"
        action: "create"
        model: "project_deliverable_type_category"
        save_as: "category"
        values:
          name: "Software Deliverable"
          code: "SD001"

      - step: "Create deliverable type"
        action: "create"
        model: "project_deliverable_type"
        save_as: "deliverable_type"
        values:
          name: "Source Code"
          code: "SC001"
          category_id: "EVAL: registry['category'].id"

      - step: "Assert deliverable type created"
        action: "assert"
        target: "deliverable_type"
        asserts:
          name:
            type: "value"
            expected: "Source Code"
          active:
            type: "value"
            expected: true

  - name: "Project Milestone - Completion without tasks is zero"
    steps:
      - step: "Create project"
        action: "create"
        model: "project.project"
        save_as: "project"
        values:
          name: "Test Milestone Empty Project"

      - step: "Create project milestone without task"
        action: "create"
        model: "project_milestone"
        save_as: "milestone"
        as_user: "base.user_admin"
        values:
          name: "Empty Milestone"
          project_id: "REC: project.id"
          date: "2024-12-31"

      - step: "Assert zero tasks and zero percentage"
        action: "assert"
        target: "milestone"
        asserts:
          number_of_task:
            type: "value"
            expected: 0
          task_completion_percentage:
            type: "value"
            expected: 0.0

