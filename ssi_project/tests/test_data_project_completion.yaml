        as_user: "base.user_admin"
        context:
          bypass_policy_check: true
        asserts:
          state:
            type: "value"
            expected: "confirm"
      - step: "Approve child_1"
        action: "call"
        target: "child_1"
        method: "action_approve_approval"
        as_user: "base.user_admin"
        context:
          bypass_policy_check: true
        asserts:
          state:
            type: "value"
            expected: "open"
      - step: "Confirm child_2"
        action: "call"
        target: "child_2"
        method: "action_confirm"
        as_user: "base.user_admin"
        context:
          bypass_policy_check: true
        asserts:
          state:
            type: "value"
            expected: "confirm"
      - step: "Approve child_2"
        action: "call"
        target: "child_2"
        method: "action_approve_approval"
        as_user: "base.user_admin"
        context:
          bypass_policy_check: true
        asserts:
          state:
            type: "value"
            expected: "open"
      - step: "Create task_1"
        action: "create"
        model: "project.task"
        save_as: "task_1"
        values:
          name: "Task task_1 PC"
          project_id: "REC: project.id"
          stage_id: "REC: stage_done.id"
          phase_id: "REC: child_1.id"
      - step: "Create deliverable type category"
        action: "create"
        model: "project_deliverable_type_category"
        save_as: "category"
        values:
          name: "Category PC"
          code: "PCC"
      - step: "Create deliverable type"
        action: "create"
        model: "project_deliverable_type"
        save_as: "dtype"
        values:
          name: "Type PC"
          code: "PCT"
          category_id: "REC: category.id"
      - step: "Create deliverable of child_1"
        action: "create"
        model: "project_deliverable"
        save_as: "deliverable_1"
        as_user: "base.user_admin"
        values:
          name: "deliverable_child_1"
          title: "deliverable_child_1"
          ttype: "single"
          project_id: "REC: project.id"
          phase_id: "REC: child_1.id"
          date_due: "2024-12-31"
          category_id: "REC: category.id"
          type_id: "REC: dtype.id"
      - step: "Confirm deliverable_1"
        action: "call"
        target: "deliverable_1"
        method: "action_confirm"
        as_user: "base.user_admin"
        context:
          bypass_policy_check: true
        asserts:
          state:
            type: "value"
            expected: "confirm"
      - step: "Approve deliverable_1"
        action: "call"
        target: "deliverable_1"
        method: "action_approve_approval"
        as_user: "base.user_admin"
        context:
          bypass_policy_check: true
        asserts:
          state:
            type: "value"
            expected: "open"
      - step: "Create task of deliverable_1"
        action: "create"
        model: "project.task"
        save_as: "task_deliverable_1"
        values:
          name: "Task deliverable_1 PC"
          project_id: "REC: project.id"
          stage_id: "REC: stage_done.id"
          deliverable_id: "REC: deliverable_1.id"
      - step: "Finish deliverable_1"
        action: "call"
        target: "deliverable_1"
        method: "action_done"
        as_user: "base.user_admin"
        context:
          bypass_policy_check: true
        asserts:
          state:
            type: "value"
            expected: "done"
      - step: "Assert child_1 is fully complete"
        action: "assert"
        target: "child_1"
        asserts:
          task_completion_percentage:
            type: "value"
            expected: 1.0
          deliverable_completion_percentage:
            type: "value"
            expected: 1.0
          completion_percentage:
            type: "value"
            expected: 1.0
      - step: "Assert only completed child is done"
        action: "assert"
        target: "parent_phase"
        asserts:
          number_of_child:
            type: "value"
            expected: 2
          number_of_child_done:
            type: "value"
            expected: 1
          child_completion_percentage:
            type: "value"
            expected: 0.5

