options:
  auto_refresh: true

scenarios:
  - name: "Project Phase - Task counts and percentage of a single phase"
    steps:
      - step: "Create project"
        action: "create"
        model: "project.project"
        save_as: "project"
        values:
          name: "Completion Project PT"
      - step: "Create stage done"
        action: "create"
        model: "project.task.type"
        save_as: "stage_done"
        values:
          name: "Done PT"
          state: "done"
      - step: "Create stage open"
        action: "create"
        model: "project.task.type"
        save_as: "stage_open"
        values:
          name: "Open PT"
          state: "open"
      - step: "Create phase"
        action: "create"
        model: "project_phase"
        save_as: "phase"
        as_user: "base.user_admin"
        values:
          name: "phase"
          title: "phase"
          ttype: "single"
          project_id: "REC: project.id"
          date_due: "2024-12-31"
      - step: "Create task_1"
        action: "create"
        model: "project.task"
        save_as: "task_1"
        values:
          name: "Task task_1 PT"
          project_id: "REC: project.id"
          stage_id: "REC: stage_open.id"
          phase_id: "REC: phase.id"
      - step: "Create task_2"
        action: "create"
        model: "project.task"
        save_as: "task_2"
        values:
          name: "Task task_2 PT"
          project_id: "REC: project.id"
          stage_id: "REC: stage_open.id"
          phase_id: "REC: phase.id"
      - step: "Move task_1 to done stage"
        action: "write"
        target: "task_1"
        values:
          stage_id: "REC: stage_done.id"
      - step: "Assert half of tasks done"
        action: "assert"
        target: "phase"
        asserts:
          number_of_task:
            type: "value"
            expected: 2
          number_of_task_done:
            type: "value"
            expected: 1
          task_completion_percentage:
            type: "value"
            expected: 0.5
      - step: "Move task_2 to done stage"
        action: "write"
        target: "task_2"
        values:
          stage_id: "REC: stage_done.id"
      - step: "Assert all tasks done"
        action: "assert"
        target: "phase"
        asserts:
          number_of_task:
            type: "value"
            expected: 2
          number_of_task_done:
            type: "value"
            expected: 2
          task_completion_percentage:
            type: "value"
            expected: 1.0

  - name: "Project Phase - Task percentage without task is zero"
    steps:
      - step: "Create project"
        action: "create"
        model: "project.project"
        save_as: "project"
        values:
          name: "Completion Project PE"
      - step: "Create phase"
        action: "create"
        model: "project_phase"
        save_as: "phase"
        as_user: "base.user_admin"
        values:
          name: "phase_empty"
          title: "phase"
          ttype: "single"
          project_id: "REC: project.id"
          date_due: "2024-12-31"
      - step: "Assert zero tasks without error"
        action: "assert"
        target: "phase"
        asserts:
          number_of_task:
            type: "value"
            expected: 0
          number_of_task_done:
            type: "value"
            expected: 0
          task_completion_percentage:
            type: "value"
            expected: 0.0

