scenarios:
  - name: "Task Dependency - finish_start type is stored"
    options:
      auto_refresh: true
    steps:
      - step: "Create project"
        action: "create"
        model: "project.project"
        save_as: "project"
        values:
          name: "Dependency Project finish_start"

      - step: "Create predecessor task"
        action: "create"
        model: "project.task"
        save_as: "pred"
        values:
          name: "Predecessor finish_start"
          project_id: "REC: project.id"

      - step: "Create successor task"
        action: "create"
        model: "project.task"
        save_as: "succ"
        values:
          name: "Successor finish_start"
          project_id: "REC: project.id"

      - step: "Create finish_start dependency"
        action: "create"
        model: "task.dependency"
        save_as: "dep"
        values:
          project_id: "REC: project.id"
          task_id: "REC: succ.id"
          predecessor_task_id: "REC: pred.id"
          dependency_type: "finish_start"

      - step: "Assert dependency type and tasks"
        action: "assert"
        target: "dep"
        asserts:
          dependency_type:
            type: "value"
            expected: "finish_start"
          task_id:
            type: "m2o"
            expected: "REC: succ"
          predecessor_task_id:
            type: "m2o"
            expected: "REC: pred"

