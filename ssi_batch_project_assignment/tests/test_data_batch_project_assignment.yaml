scenarios:
  - name: "Batch Project Assignment - Full workflow with assignees"
    steps:
      - step: "Create project role"
        action: "create"
        model: "project.role"
        save_as: "role"
        values:
          name: "Batch Developer Role"
          code: "BDEV001"

      - step: "Create project"
        action: "create"
        model: "project.project"
        save_as: "project"
        values:
          name: "Test Batch Project"

      - step: "Create batch project assignment"
        action: "create"
        model: "project.batch_assignment"
        save_as: "batch"
        as_user: "base.user_admin"
        values:
          project_id: "EVAL: registry['project'].id"
          date_assign: "2024-01-15"
          date_start: "2024-01-15"
          date_end: "2024-12-31"

      - step: "Create batch assignee"
        action: "create"
        model: "project.batch_assignment_assignee"
        save_as: "assignee"
        values:
          batch_id: "EVAL: registry['batch'].id"
          role_id: "EVAL: registry['role'].id"
          assignee_id: "REF: base.user_admin"
          sequence: 10

      - step: "Assert batch assignment in draft"
        action: "assert"
        target: "batch"
        asserts:
          state:
            type: "value"
            expected: "draft"

      - step: "Confirm batch assignment"
        action: "call"
        target: "batch"
        method: "action_confirm"
        as_user: "base.user_admin"
        asserts:
          state:
            type: "value"
            expected: "confirm"

      - step: "Invalidate cache after confirm"
        action: "call"
        target: "batch"
        method: "invalidate_cache"

      - step: "Approve batch assignment"
        action: "call"
        target: "batch"
        method: "action_approve_approval"
        as_user: "base.user_admin"
        asserts:
          state:
            type: "value"
            expected: "open"

      - step: "Invalidate cache after open"
        action: "call"
        target: "batch"
        method: "invalidate_cache"

      - step: "Mark batch as done"
        action: "call"
        target: "batch"
        method: "action_done"
        as_user: "base.user_admin"
        context:
          bypass_policy_check: true
        asserts:
          state:
            type: "value"
            expected: "done"

  - name: "Batch Project Assignment - Verify individual assignments created"
    steps:
      - step: "Create project role"
        action: "create"
        model: "project.role"
        save_as: "role"
        values:
          name: "Verify Role"
          code: "VR001"

      - step: "Create project"
        action: "create"
        model: "project.project"
        save_as: "project"
        values:
          name: "Verify Batch Project"

      - step: "Create batch with assignee"
        action: "create"
        model: "project.batch_assignment"
        save_as: "batch"
        as_user: "base.user_admin"
        values:
          project_id: "EVAL: registry['project'].id"
          date_assign: "2024-02-01"
          date_start: "2024-02-01"
          date_end: "2024-12-31"

      - step: "Create batch assignee"
        action: "create"
        model: "project.batch_assignment_assignee"
        save_as: "assignee2"
        values:
          batch_id: "EVAL: registry['batch'].id"
          role_id: "EVAL: registry['role'].id"
          assignee_id: "REF: base.user_admin"
          sequence: 5

      - step: "Confirm batch to create assignments"
        action: "call"
        target: "batch"
        method: "action_confirm"
        as_user: "base.user_admin"

      - step: "Verify individual assignment created"
        action: "search"
        model: "project.batch_assignment_assignee"
        domain:
          - ["batch_id", "=", "EVAL: registry['batch'].id"]
        save_as: "assignee_record"
        expect_count: 1
